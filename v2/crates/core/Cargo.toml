[package]
name = "plan-core"
description = "Planstudio core: units, intent, solver, builder and DSL. No I/O."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "plan_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11.1"
nalgebra = "0.35"

[dev-dependencies]
proptest = "1"
