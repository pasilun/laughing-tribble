[package]
name = "plan-server"
description = "Planstudio MCP server: check, get, apply and render plans over stdio."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "plan_server"
path = "src/lib.rs"

[[bin]]
name = "plan-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
plan-core = { path = "../core" }
plan-render = { path = "../render" }
base64 = "0.23"
rmcp = { version = "=3.9.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
