name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        run: npx vercel@54.1.0 --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Availability only: the login page and the MCP endpoint are public.
      - name: Production smoke
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          for path in /plans/login /api/mcp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${PROD_URL}${path}")
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done
